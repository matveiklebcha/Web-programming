<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Revo Coffee</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header id="Home" class="hero">
      <div class="container hero__container">
        <div class="hero__info">
          <img class="hero__logo" src="/img/revo-logo.svg" alt="Revo Coffee" />
          <h1 class="hero__title">
            <span class="hero__text-line"> YOUR</span>
            <span class="hero__text-line hero__text-line--highlight"
              >PERSONALIZED</span
            >
            <span class="hero__text-line"> COFFEE</span>
          </h1>
        </div>

        <div class="hero__image-wrapper">
          <button class="hero__play-btn">
            <img
              class="hero__play-icon"
              src="img/play-button.svg"
              alt="Play button"
            />
          </button>
        </div>

        <nav class="hero__nav">
          <div class="hero__cart">
            <img src="img/shopping-cart.svg" alt="Shopping cart" />
          </div>
          <ul class="hero__nav-list">
            <li>
              <a class="hero__nav-link hero__nav-link--header" href="#Home"
                >TRANG CHỦ</a
              >
            </li>
            <li><a class="hero__nav-link" href="#">COFFEE</a></li>
            <li><a class="hero__nav-link" href="#">PHIN MẠ MÀU</a></li>
            <li><a class="hero__nav-link" href="#">COMBO PHIN PHÊ</a></li>
            <li><a class="hero__nav-link" href="#">GIFTSET</a></li>
            <li><a class="hero__nav-link" href="#">LIÊN HỆ</a></li>
          </ul>
        </nav>
      </div>
    </header>
  </body>
</html>
