<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Каталог кофе | Revo Coffee</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="catalog-page">
    <header class="catalog-header">
      <div class="container catalog-header__container">
        <a class="catalog-header__logo-link" href="index.html#Catalog">
          <img
            class="catalog-header__logo"
            src="img/brand/revo-logo.svg"
            alt="Revo Coffee"
          />
        </a>
        <nav class="catalog-header__nav" aria-label="Навигация каталога">
          <a class="catalog-header__back" href="index.html#Catalog">Главная</a>
          <a class="catalog-header__back" href="catalog.html">Каталог</a>
          <a class="catalog-header__back" href="favorites.html">Избранное</a>
          <a class="catalog-header__back" href="cart.html">Корзина</a>
        </nav>
      </div>
    </header>

    <main>
      <section class="products">
        <div class="container products__container">
          <div class="section-header products__header">
            <p class="section-header__slogan">Revo Coffee</p>
            <h1 class="section-header__title">Каталог кофе</h1>
          </div>

          <div class="products__controls" aria-label="Управление каталогом">
            <label class="products__search">
              <span class="products__label">Поиск</span>
              <input
                id="searchInput"
                class="products__input"
                type="search"
                placeholder="Название, описание, происхождение"
                autocomplete="off"
              />
            </label>

            <label class="products__sort">
              <span class="products__label">Сортировка</span>
              <select id="sortSelect" class="products__select">
                <option value="default">По умолчанию</option>
                <option value="price-asc">Цена по возрастанию</option>
                <option value="price-desc">Цена по убыванию</option>
                <option value="name-asc">Название А-Я</option>
                <option value="rating-desc">Рейтинг по убыванию</option>
              </select>
            </label>
          </div>

          <div
            id="categoryFilters"
            class="products__filter-group"
            aria-label="Категории кофе"
          ></div>

          <div class="products__advanced" aria-label="Расширенные фильтры">
            <label class="products__field">
              <span class="products__label">Обжарка</span>
              <select id="roastSelect" class="products__select">
                <option value="">Любая</option>
                <option value="Light">Light</option>
                <option value="Medium">Medium</option>
                <option value="Dark">Dark</option>
              </select>
            </label>

            <label class="products__field">
              <span class="products__label">Происхождение</span>
              <select id="originSelect" class="products__select">
                <option value="">Любое</option>
              </select>
            </label>

            <label class="products__field">
              <span class="products__label">Цена от</span>
              <input
                id="minPriceInput"
                class="products__input"
                type="number"
                min="0"
                step="1000"
                placeholder="0"
              />
            </label>

            <label class="products__field">
              <span class="products__label">Цена до</span>
              <input
                id="maxPriceInput"
                class="products__input"
                type="number"
                min="0"
                step="1000"
                placeholder="250000"
              />
            </label>

            <label class="products__field">
              <span class="products__label">Рейтинг от</span>
              <select id="ratingSelect" class="products__select">
                <option value="">Любой</option>
                <option value="4.5">4.5</option>
                <option value="4.7">4.7</option>
                <option value="4.9">4.9</option>
              </select>
            </label>

            <label class="products__field">
              <span class="products__label">Интенсивность от</span>
              <select id="intensitySelect" class="products__select">
                <option value="">Любая</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
                <option value="5">5</option>
              </select>
            </label>
          </div>

          <div class="products__toolbar">
            <label class="products__limit">
              <span class="products__label">На странице</span>
              <select id="limitSelect" class="products__select">
                <option value="6">6</option>
                <option value="9">9</option>
                <option value="12">12</option>
              </select>
            </label>
            <button id="resetFilters" class="btn btn--secondary products__reset" type="button">
              Сбросить фильтры
            </button>
          </div>

          <p id="productsStatus" class="products__count" aria-live="polite"></p>
          <p id="productsError" class="products__error" hidden></p>
          <p id="productsLoader" class="products__loader" hidden>Загрузка каталога...</p>

          <div id="productsGrid" class="products__grid"></div>

          <div id="emptyState" class="products__empty" hidden>
            <h2 class="products__empty-title">Кофе не найден</h2>
            <p class="products__empty-text">
              Попробуйте изменить запрос, категорию или расширенные фильтры.
            </p>
          </div>

          <div class="products__pagination" aria-label="Пагинация каталога">
            <button id="prevPageButton" class="btn btn--secondary" type="button">
              Назад
            </button>
            <span id="paginationInfo" class="products__pagination-info"></span>
            <button id="nextPageButton" class="btn btn--secondary" type="button">
              Вперед
            </button>
          </div>
        </div>
      </section>
    </main>

    <p id="notice" class="notice" hidden></p>

    <footer class="footer" id="Footer">
      <p class="footer__text">© Revo Coffee Việt Nam - 2018</p>
    </footer>
    <script type="module" src="catalog.js"></script>
  </body>
</html>
