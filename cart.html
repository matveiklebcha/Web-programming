<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Корзина | Revo Coffee</title>
    <link rel="icon" href="img/brand/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="catalog-page is-loading">
    <header class="catalog-header">
      <div class="container catalog-header__container">
        <a class="catalog-header__logo-link" href="index.html#Catalog">
          <img
            class="catalog-header__logo"
            src="img/brand/revo-logo.svg"
            alt="Revo Coffee"
          />
        </a>
        <nav class="catalog-header__nav" aria-label="Навигация магазина">
          <a class="catalog-header__back" href="index.html#Catalog" data-i18n="nav.home">Главная</a>
          <a class="catalog-header__back" href="catalog.html" data-i18n="nav.catalog">Каталог</a>
          <a class="catalog-header__back" href="favorites.html" data-i18n="nav.favorites">Избранное</a>
          <a class="catalog-header__back" href="cart.html" aria-current="page" data-i18n="nav.cart">Корзина</a>
          <a class="catalog-header__back" href="feedback.html" data-i18n="nav.feedback">Отзывы</a>
          <a class="catalog-header__back" href="auth.html" data-i18n="nav.profile">Профиль</a>
          <a class="catalog-header__back" href="admin.html" data-session-admin hidden data-i18n="nav.admin">Админ-панель</a>
        </nav>
      </div>
    </header>

    <main>
      <section class="products">
        <div class="container products__container">
          <div class="section-header products__header">
            <p class="section-header__slogan">Revo Coffee</p>
            <h1 class="section-header__title" data-i18n="cart.title">Корзина</h1>
          </div>

          <p id="cartStatus" class="products__count" aria-live="polite"></p>
          <p id="cartError" class="products__error" role="alert" hidden></p>
          <p id="cartLoader" class="products__loader" hidden data-i18n="cart.loading">Загрузка корзины...</p>

          <div id="cartList" class="cart-list"></div>

          <div id="cartEmpty" class="products__empty" hidden>
            <h2 class="products__empty-title" data-i18n="cart.emptyTitle">Корзина пуста</h2>
            <p class="products__empty-text" data-i18n="cart.emptyText">
              Добавьте кофе из каталога, чтобы оформить заказ.
            </p>
            <a class="btn btn--primary products__reset" href="catalog.html" data-i18n="common.goCatalog">Перейти в каталог</a>
          </div>

          <div id="cartSummary" class="cart-summary" hidden>
            <p class="cart-summary__label" data-i18n="cart.total">Итого</p>
            <p id="cartTotal" class="cart-summary__total"></p>
            <button id="checkoutButton" class="btn btn--primary" type="button" data-i18n="cart.checkout">
              Оформить покупку
            </button>
          </div>
        </div>
      </section>
    </main>

    <p id="notice" class="notice" role="status" aria-live="polite" hidden></p>

    <footer class="footer" id="Footer">
      <p class="footer__text" data-i18n="footer.copyright">© Revo Coffee, Вьетнам · 2018</p>
    </footer>
    <script type="module" src="cart.js"></script>
  </body>
</html>
